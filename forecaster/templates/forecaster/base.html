<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline Forecaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <nav class="bg-blue-600 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'project_list' %}" class="text-xl font-bold">Deadline Forecaster</a>
            <div>
                <a href="{% url 'project_list' %}" class="px-3 hover:text-blue-200">Projects</a>
                <a href="/admin/" class="px-3 hover:text-blue-200">Admin</a>
            </div>
        </div>
    </nav>
    <main class="container mx-auto p-4 flex-grow">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-gray-800 text-white p-4 text-center mt-auto">
        &copy; 2024 Deadline Forecaster
    </footer>
</body>
</html>
